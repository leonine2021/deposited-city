<html lang="zh-Hans" data-lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>界：析出的城市 · Boundary: The Deposited City</title>
    <meta name="description" content="An architect's exhibition on where lines come from · Architect Wenlu Guo" />
    <meta name="theme-color" content="#f4f2ed" />
    <meta property="og:title" content="界：析出的城市 · Boundary: The Deposited City" />
    <meta property="og:description" content="An architect's exhibition on where lines come from · Architect Wenlu Guo" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://leonine2021.github.io/deposited-city/works/01.webp" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f4f2ed'/%3E%3Cpath d='M16 5v22' stroke='%23161514' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;600&display=swap"
    />
    <script>
      // pick language and theme before first paint so the page never flashes the wrong one
      var lang = /^zh/i.test(navigator.language) ? 'zh' : 'en'
      try {
        lang = localStorage.getItem('lang') || lang
      } catch (e) {}
      document.documentElement.dataset.lang = lang
      document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en'
      // theme: the visitor's saved choice, otherwise the system setting
      var theme = null
      try {
        theme = localStorage.getItem('theme')
      } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      document.documentElement.dataset.theme = theme
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
